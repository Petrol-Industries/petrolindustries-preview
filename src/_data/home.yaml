dna:
  eyebrow: Our DNA
  heading: Motor-centric thinking drives our direction.
  paragraphs:
    - "At Petrol, we've made jeans wear and denim related products since 1989 —
      for a fair price and high quality. The heart of our heritage is in the car
      scene. We're equally inspired by the past, the present and the future: we
      love old cars, but we also love finding new ways to keep our freedom, hunt
      for adventure, and stay a little rebellious."
    - Every season we're on the hunt for new fits and old techniques to combine
      them with. Denim isn't just part of our range — it's part of our identity.
  quote: The everyman. One of the crew. The guy of today and tomorrow.
  image: assets/img/fw26_054.jpg
  image_alt: Petrol Industries FW26 model in an industrial warehouse, wearing a
    knitted sweater
  image_tag: FW26 · Warehouse
