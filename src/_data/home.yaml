hero:
  season_label: Fall | Winter 2026 — B2B Preview
  heading_line1: Denim
  heading_line2: Driven.
  lede: The new season, built on the same motor-centric DNA we've run on since
    1989. Rough, authentic, practical gear for the guy who tunes into his inner
    petrolhead.
  image: assets/img/fw26_240.jpg
  image_alt: Petrol Industries FW26 campaign, three models by a vintage pick-up
    truck at an industrial site
